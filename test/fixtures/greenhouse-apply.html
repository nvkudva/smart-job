<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Senior Software Engineer - Acme (Greenhouse-like)</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; }
  .field { margin: 12px 0; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=email], input[type=tel], input[type=url], select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
  .honeypot { display: none; }
</style>
</head>
<body>
<h1>Senior Software Engineer</h1>
<h2>Apply for this job</h2>
<form id="application_form" onsubmit="return false">
  <div class="honeypot"><input type="text" name="job_application[website_hp]" tabindex="-1" /></div>
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" required /></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" required /></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="email" id="email" name="job_application[email]" required /></div>
  <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="job_application[phone]" /></div>
  <div class="field" id="resume_fieldset">
    <label for="resume">Resume/CV <span class="asterisk">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" required />
  </div>
  <div class="field">
    <label for="cover_letter">Cover Letter</label>
    <input type="file" id="cover_letter" name="job_application[cover_letter]" />
  </div>
  <div class="field"><label for="q_linkedin">LinkedIn Profile</label><input type="text" id="q_linkedin" name="job_application[answers_attributes][0][text_value]" /></div>
  <div class="field"><label for="q_website">Website</label><input type="text" id="q_website" name="job_application[answers_attributes][1][text_value]" /></div>
  <div class="field"><label for="q_company">Current Company</label><input type="text" id="q_company" name="job_application[answers_attributes][2][text_value]" /></div>
  <div class="field">
    <label for="q_auth">Are you legally authorized to work in the United States? <span class="asterisk">*</span></label>
    <select id="q_auth" name="job_application[answers_attributes][3][boolean_value]" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </div>
  <div class="field">
    <label for="q_sponsor">Will you now or in the future require sponsorship for employment visa status? <span class="asterisk">*</span></label>
    <select id="q_sponsor" name="job_application[answers_attributes][4][boolean_value]" required><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select>
  </div>
  <div class="field">
    <label for="q_hear">How did you hear about this job?</label>
    <select id="q_hear" name="job_application[answers_attributes][5][value]"><option value="">Please select</option><option value="1">Employee Referral</option><option value="2">LinkedIn</option><option value="3">Other</option></select>
  </div>
  <div class="field">
    <label for="q_why">Why do you want to work here? <span class="asterisk">*</span></label>
    <textarea id="q_why" name="job_application[answers_attributes][6][text_value]" required></textarea>
  </div>

  <h3>Voluntary Self-Identification</h3>
  <div class="field"><label for="gender">Gender</label>
    <select id="gender" name="job_application[gender]"><option value="">Select...</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label>
    <select id="hispanic" name="job_application[hispanic_ethnicity]"><option value="">Select...</option><option value="1">Yes</option><option value="2">No</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="race">Race</label>
    <select id="race" name="job_application[race]"><option value="">Select...</option><option value="1">Asian</option><option value="2">White</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field"><label for="veteran">Veteran Status</label>
    <select id="veteran" name="job_application[veteran_status]"><option value="">Select...</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of protected veteran</option><option value="3">I don't wish to answer</option></select></div>
  <div class="field"><label for="disability">Disability Status</label>
    <select id="disability" name="job_application[disability_status]"><option value="">Select...</option><option value="1">Yes, I have a disability, or have had one in the past</option><option value="2">No, I do not have a disability and have not had one in the past</option><option value="3">I do not want to answer</option></select></div>
  <button type="button" id="submit_app">Submit Application</button>
</form>
<script src="/form-state.js"></script>
</body>
</html>
